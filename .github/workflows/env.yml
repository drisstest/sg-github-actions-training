name: context_test

on: 
  workflow_dispatch:

jobs: 
  afficher_contexte: 
    runs-on: ubuntu-24.04
    steps: 
      - name: afficher le user 
        run: | 
          echo "Déclenché par : ${{ github.actor }}"
      
      - name: afficher la branche 
        run: | 
          echo "Branche : ${{ github.ref_name }}"
        
      - name: Quel événement ?
        run: |
          echo "Événement : ${{ github.event_name }}"
    