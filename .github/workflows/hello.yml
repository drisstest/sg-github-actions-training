name: Hello World 

on: push 

jobs: 

  say-hello: 

    runs-on: ubuntu-latest 

    steps: 
      - name: Checkout code  # copie les fichiers du dépôt sur la VM
        uses: actions/checkout@v4 

      - name: Setup Python # installe l'environnement python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install pytest
        run: pip install pytest

      - name: Run tests  # lance les tests
        run: pytest 

      